<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="ページをつなぎ、考えを育てる。Markdown 対応の個人用ワークスペース。"><meta name="theme-color" content="#526a53"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/assets/icon-192.png"><link rel="apple-touch-icon" href="/assets/icon-192.png"><title>folia — あなたのワークスペース</title><link rel="stylesheet" href="/src/style.css"></head><body>
<aside id="sidebar"><a class="brand" href="#"><span class="logo">f</span> folia <span class="personal">PERSONAL</span></a><div class="workspace"><span class="avatar">M</span><div>My workspace<small>あなたの考えが育つ場所</small></div></div><button id="search-open" class="nav"><span>⌕</span> 検索 <kbd>⌘ K</kbd></button><button id="oss-open" class="nav">▦ OSS プロジェクト</button><button id="home" class="nav"><span>⌂</span> ワークスペース</button><div class="section-label">プライベート <button id="add-root" aria-label="ページを追加">＋</button></div><nav id="tree" aria-label="ページ一覧"></nav><button id="new-page" class="nav muted">＋ 新しいページ</button><div class="sidebar-bottom"><div class="offline-controls"><span id="offline-status" role="status"></span><button id="install-app" hidden>アプリをインストール</button><button id="update-app" hidden>更新して再読み込み</button></div><button id="trash-open" class="nav">♲ ゴミ箱 <span id="trash-count"></span></button><button id="import" class="nav">↥ Markdown を読み込む</button><button id="backup" class="nav">⇩ ワークスペースを保存</button><button id="restore" class="nav">↥ バックアップを復元</button><p><span class="green-dot"></span> このブラウザに保存</p></div></aside>
<div id="shell"><header><button id="toggle-sidebar" aria-label="サイドバーを開閉">☰</button><div id="breadcrumb"></div><div class="header-right"><span id="save-status" role="status">保存済み</span><button id="undo" title="元に戻す (Ctrl / ⌘ Z)" aria-label="元に戻す" disabled>↶</button><button id="redo" title="やり直す (Ctrl / ⌘ Shift Z)" aria-label="やり直す" disabled>↷</button><button id="favorite" aria-label="お気に入り">☆</button><button id="export">↗ Markdown</button><button id="page-menu" aria-label="ページ操作">•••</button></div></header><main id="main"></main><footer>小さなメモから、大きなアイデアへ。</footer></div>
<dialog id="oss-dialog"></dialog>
<dialog id="template-dialog"></dialog>
<dialog id="search-dialog"><div class="search-field"><span>⌕</span><input id="search-input" placeholder="ページや本文を検索…" aria-label="検索"><button id="search-close">Esc</button></div><div id="search-results"></div></dialog>
<dialog id="trash-dialog" aria-labelledby="trash-title"><div class="trash-heading"><h2 id="trash-title">ゴミ箱</h2><button id="trash-close" aria-label="ゴミ箱を閉じる">閉じる</button></div><p class="trash-hint">子ページもまとめて復元できます。自動では削除されません。</p><div class="trash-toolbar"><input id="trash-search" type="search" placeholder="削除したページを検索…" aria-label="ゴミ箱を検索"><button id="trash-empty" class="danger">ゴミ箱を空にする</button></div><div id="trash-list"></div></dialog>
<dialog id="action-dialog"><form method="dialog"><h2 id="action-title"></h2><div id="action-body"></div><div class="dialog-actions"><button value="cancel">キャンセル</button><button id="action-confirm" value="confirm" class="primary">保存</button></div></form></dialog><input id="file" type="file" accept=".md,.markdown,text/markdown" hidden><input id="backup-file" type="file" accept=".json,application/json" hidden><div id="toast" role="status"></div><script type="module" src="/src/app.js"></script></body></html>
